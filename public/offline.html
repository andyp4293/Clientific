<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clientific | Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top right, rgba(16, 185, 129, 0.14), transparent 42%),
          radial-gradient(circle at top left, rgba(15, 23, 42, 0.08), transparent 32%),
          #f8fafc;
        color: #0f172a;
      }

      main {
        width: min(100% - 2rem, 28rem);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 1.5rem;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #0f766e;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #475569;
      }

      a {
        display: inline-flex;
        margin-top: 1.5rem;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0.85rem 1.1rem;
        background: #0f766e;
        color: #f8fafc;
        font-weight: 600;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(circle at top right, rgba(45, 212, 191, 0.18), transparent 42%),
            radial-gradient(circle at top left, rgba(30, 41, 59, 0.28), transparent 34%),
            #020617;
          color: #f8fafc;
        }

        main {
          border-color: rgba(71, 85, 105, 0.6);
          background: rgba(15, 23, 42, 0.92);
          box-shadow: 0 24px 60px rgba(2, 6, 23, 0.42);
        }

        .eyebrow {
          color: #5eead4;
        }

        p {
          color: #cbd5e1;
        }

        a {
          background: #14b8a6;
          color: #042f2e;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Clientific</p>
      <h1>Connection lost</h1>
      <p>The page could not load right now. Check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
